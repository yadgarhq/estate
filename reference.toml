# The observable constants the contract suite asserts against.
#
# WHY THIS FILE EXISTS. A deployment-tuning change — a bucket size, a response
# floor, a new infrastructure header at the edge — is a change to what this
# suite must expect. If those numbers lived as literals inside test code, the
# person changing the deployment would never see them, and the suite would go
# red for a reason that is not a defect. Declaring them here makes the update a
# reviewed one-line pull request in this repository, and it puts the declaration
# where the reviewer of the deployment change will be sent.
#
# EVERY VALUE HERE WAS MEASURED against the reference cluster on 2026-09-05, not
# copied from a document. Where a value is a closed set, it is closed: a header
# or a tool name outside the set fails the row, and admitting a new one is a
# reviewed edit to this file rather than a silent loosening of an assertion.
#
# STAGE 1 ONLY. This file carries what the ten smoke rows read and nothing else.
# The login response floor (C-15), the token-bucket rates (C-16/C-17), the closed
# `outcome` label set (A-10) and the `yaadgaar` client pin (C-19) belong to the
# stages that introduce those rows; adding them now would be declaring constants
# nothing reads, which is how a declared constant drifts from the deployment
# without anything noticing.

[edge]
# The name a real client dials, and the only name this suite ever dials. TLS is
# validated against `ca/root.pem` and nothing else; resolution may be redirected
# (`hostAliases` on the runner pod in-cluster, `ESTATE_EDGE_RESOLVE` locally) but
# trust never is.
host = "gateway.yadgar.internal"
port = 443
# ADR-0490/0504: the leaf must chain to the committed name-constrained root, and
# must NOT chain to the public web PKI. C-14 asserts both halves.
root_pem = "ca/root.pem"

[identity]
# THE TWO STANDING IDENTITIES the ceremony creates, and the ONE place their names
# are written (ADR-0569, ledger 716). They used to be `DEFAULT_USERNAME` and
# `DEFAULT_USERNAME_2` in `crates/front/src/lib.rs`, behind an `ESTATE_USERNAME`
# environment read that nothing in this repository or in `smoke.yaml` ever set —
# so a constant no operator could see was the effective value, which is the state
# ADR-0569 exists to delete. Here they are a line a reader can edit.
#
# NOT MEASURED, unlike every other value in this file, and the difference is
# stated rather than hidden. These are DECLARED: `MIGRATION_NOTES.md` section 5
# tells the operator to create `estate-suite` and `estate-suite-2` through iam's
# `CreateUser`, and `scripts/enrol.sh` then reads the username BACK out of the
# enrol response rather than choosing it. A ceremony that named them otherwise
# makes this file the one-line change, and C-03's positive control is what fails
# loudly if the names here and the accounts in iam disagree.
#
# The PASSWORDS are not here and never will be. They arrive as `ESTATE_PASSWORD`
# and `ESTATE_PASSWORD_2` from the `estate` GitHub environment, and their absence
# is reported as a missing credential rather than as a failing contract.
primary = "estate-suite"
secondary = "estate-suite-2"

[mcp]
# `gateway/src/mcp.rs:30`. The one revision this server implements.
protocol_version = "2026-07-28"
# `server/discover`'s `_meta` serverInfo name (measured).
server_name = "yadgar-gateway"
# Every MCP result carries this — `mcp::result` inserts it unconditionally.
result_type = "complete"
# C-06: CLOSED-SET EQUALITY over the whole tool surface, never an absence check
# for known-bad names. A tool appearing without a deliberate edit here is the
# review moment ADR-0562 exists to force; if the new name is administrative,
# privilege escalation is one prompt injection away.
tools = ["create_task", "read_task", "find_tasks"]

[login]
# C-02. The infrastructure-header allowlist, measured from a live failed login on
# 2026-09-05: exactly `content-type`, `content-length`, `date`. A header outside
# this set fails the row. `www-authenticate` is absent and its absence is the
# assertion — ADR-0507's two-status collapse discloses nothing about which side
# of verification failed, and a challenge header would disclose it.
allowed_headers = ["content-type", "content-length", "date"]
# Byte-exact, measured. Not a substring match: a test that only asserts "a
# refusal happened" passes against the leaking version.
refusal_body = '{"error":"invalid username or password"}'
refusal_status = 401

[confinement]
# C-18. The front-door runner must not be able to open a connection to anything
# inside the cluster; the edge is its only reachable surface.
#
# THESE ARE LIVE, RESOLVABLE ENDPOINTS, and that is a correctness condition
# rather than tidiness. C-18 asserts that a connection FAILS, so a target whose
# name does not resolve passes the row for free and can never fail — a vacuous
# assertion that would report green forever. The row therefore resolves each name
# first and fails with a distinct diagnostic if it does not resolve at all.
#
# Measured 2026-09-05 (`kubectl -n yadgar get svc`): `iam-db` and `task-db` serve
# 50051, `iam` and `task` serve 50052, each `-db` has its own MariaDB Service in
# the `yadgar` namespace, and `valkey` serves 6379. There is no
# `mariadb.mariadb-system.svc`: that namespace holds only the operator webhook.
targets = [
  "iam-db.yadgar.svc.cluster.local:50051",
  "task-db.yadgar.svc.cluster.local:50051",
  "iam-db-mariadb.yadgar.svc.cluster.local:3306",
  "valkey.yadgar.svc.cluster.local:6379",
]
connect_timeout_ms = 3000

# THIS SAID "C-18 IS RED AT BIRTH AND THE RED CARRIES A DEADLINE. kindnet
# enforces no NetworkPolicy (verified: the `kindnet` DaemonSet is the cluster's
# CNI), so the policy in `yadgarhq/deploy`'s `infra/estate-front/` is the
# specification C-18 tests rather than something the network applies."
#
# THE MEASUREMENT WAS RIGHT AND THE INFERENCE FROM IT WAS WRONG. The old text is
# quoted rather than deleted, because a reader told only "that was wrong"
# re-measures the CNI, finds kindnet, and derives the same false conclusion.
#
# STILL TRUE: the `kindnet` DaemonSet is this cluster's CNI, and there is no
# Calico, Cilium or Weave. NO LONGER TRUE: that it enforces nothing. kindnetd
# `v20260528-9350166c` runs a `kube-network-policies` controller (ledger 684),
# and ledger 511 proved ingress enforcement live twelve times over.
#
# AND C-18 HAS NEVER ACTUALLY BEEN OBSERVED RED. NINETEEN smoke runs have now
# reached the confinement step, on three separate days, and every one reported
# `ok` in exactly `18.02s` — six sequential 3000ms timeouts against the six
# addresses the four targets above resolve to. A refused connection returns at
# once; a DROPPED one burns the whole timeout, so the 18.02s IS the reading: had
# any one address accepted, that connect would have returned at once, the row
# would have FAILED, and the step would have taken about fifteen seconds.
# 2026-09-05: `33985246084`, `33987703582`, `33987725928`, `33997388647`,
# `33997423600`, `33999752662`. 2026-09-12: `34706172689`, `34708408176`,
# `34709049229`, `34709318807`, `34713792693`. 2026-09-14: `34863567216`,
# `34873346748`, `34873363311`, `34873536330`, `34873680560`, `34873848695`,
# `34875276755`, `34875568456`. The `test result: ok ... finished in 18.02s`
# line was read directly out of the logs of `33985246084` and `34875568456`,
# the oldest and the newest, rather than inferred from the step's conclusion.
# The row was written red-at-birth and has only ever measured green.
#
# WHAT ENFORCES EACH TARGET TODAY, because it is not one thing. `iam-db`,
# `task-db` and `valkey` now also carry live ingress policies in `yadgar` that
# name their real callers and exclude this runner. `iam-db-mariadb` carries
# none — no policy selects `app.kubernetes.io/name: mariadb` — so that target
# is refused by `estate-front-egress` alone, whose substance is EGRESS. The
# 18.02s arithmetic is the evidence for egress enforcement here, and
# `yadgarhq/docs`' `plans/chart-hardening.md` records it as exactly that.
#
# THERE WAS A DEADLINE HERE AND IT IS REMOVED, NOT RE-DATED (ADR-0687). This
# file carried `deadline_task = "yadgarhq/docs ledger 614"`, `deadline_date =
# "2026-10-03"` and a `deadline_summary` reading "replace kindnet with a
# NetworkPolicy-enforcing CNI (nix repo, ADR-0480)", read by a test that was
# deliberately not `#[ignore]`d. Ledger 614 is WITHDRAWN (docs#51, ADR-0594):
# plain NetworkPolicy suffices, kindnet enforces it, and Cilium is ruled out
# under rootless podman. So the task that was to clear this red was closed on
# measurement, and the red it was to clear was never observed. On 2026-10-04
# that test would have failed and blocked every merge over work ruled out five
# weeks earlier. Re-dating it would have preserved a commitment nobody holds
# and moved the outage to a new day, so the three fields and the test that read
# them are gone. C-18 is an ORDINARY HARD CHECK now: `smoke.yaml` no longer
# excuses it with `continue-on-error`, and its own verdict is the only thing
# that speaks for it.
