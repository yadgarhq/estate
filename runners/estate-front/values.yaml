# Values for the `gha-runner-scale-set` chart (actions-runner-controller).
#
# NOT APPLIED FROM HERE. This repository declares what the runner is; installing
# it is a cluster change and belongs to whoever owns the cluster. See
# MIGRATION_NOTES.md for the exact command and the two things it needs first.
#
# TWO SCALE SETS, EVENTUALLY, BECAUSE ADR-0562 REQUIRES IT. The exception job
# (`estate-annex`, stage 3) needs its own network policy — it reads Prometheus,
# the kube API and the five service ports, all of which this one must not reach.
# One scale set with a union of both policies would make the front-door runner's
# confinement meaningless, which is exactly what C-18 measures. Only
# `estate-front` exists at stage 1.
#
# THE AUDITOR'S WORKFLOWS NEVER TOUCH THIS RUNNER, and that is not tidiness.
# `adopt.yaml` and `sweep.yaml` (stage 4) mint installation tokens from a key
# that is org-wide write across every repository in the estate. This runner is a
# stated attack surface whose NetworkPolicies today enforce nothing. Putting an
# org-wide write credential inside that blast radius would make the auditor the
# softest way into every repository the auditor exists to protect — so those two
# workflows declare `runs-on: ubuntu-latest`.

githubConfigUrl: https://github.com/yadgarhq/estate

# THE SCALE SET NAME IS THE `runs-on:` LABEL. `smoke.yaml` says
# `runs-on: estate-front`; renaming this leaves that workflow queueing forever
# against a label nothing offers, with no error anywhere.
runnerScaleSetName: estate-front

# RESTRICTED TO THIS REPOSITORY. A runner group visible to the whole
# organisation would let any repository's workflow — including one added later,
# by anyone — execute inside this cluster. Create the group in the organisation
# settings and restrict it to `yadgarhq/estate` before installing this chart;
# the chart cannot create it.
runnerGroup: estate

githubConfigSecret: estate-runner-github

# The runner pod, in the namespace the NetworkPolicy beside this file governs.
template:
  spec:
    containers:
      - name: runner
        # THE IMAGE MUST CARRY A RUST TOOLCHAIN, and the default ARC image does
        # not. `smoke.yaml` uses `dtolnay/rust-toolchain`, which drives `rustup`
        # — an image without it fails at the toolchain step with a message about
        # a missing binary rather than about a missing image. Build one from
        # `ghcr.io/actions/actions-runner` plus rustup, or reuse the estate's own
        # `rust-build` base with the runner added. Named here as the empty string
        # deliberately: an image that has not been chosen must not look chosen.
        image: "" # SET THIS. See MIGRATION_NOTES.md.
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
