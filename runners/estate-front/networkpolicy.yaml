# The confinement C-18 tests.
#
# **THIS FILE IS CURRENTLY DECORATIVE, AND THAT IS WHY C-18 IS RED.** The
# cluster's CNI is kindnet, which enforces no NetworkPolicy. Every rule below is
# accepted by the API server and applied by nothing. It is shipped anyway
# because it is the SPECIFICATION the contract asserts: when the CNI changes
# (kind `disableDefaultCNI` plus Cilium or Calico — nix repo, ADR-0480), this
# file becomes true and C-18 goes green without being edited.
#
# APPLIED VIA deploy/argocd, NOT FROM HERE. This repository declares what the
# runner may reach; the repository that owns the cluster is what applies it.
# See MIGRATION_NOTES.md.
#
# WHY THE FRONT-DOOR RUNNER IS CONFINED AT ALL. ADR-0562's rule is that a
# behavioural contract is exercised through the gateway, over the public edge, as
# a real client does. Today that is discipline: any suite bug, or any compromised
# test dependency, could open a gRPC channel straight to `iam` and every row
# would still report green. This policy is what turns the discipline into a
# property of the network, and C-18 is what notices when it is not.
---
apiVersion: v1
kind: Namespace
metadata:
  name: estate-front
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: estate-front-egress
  namespace: estate-front
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # NO INGRESS RULES AT ALL, which denies all ingress. A CI runner is dialled by
  # nothing; it dials out. An empty `ingress:` list would say the same thing less
  # clearly, so the absence is deliberate and this comment is the record of it.
  egress:
    # (a) Name resolution. Without this the runner cannot resolve
    # `gateway.yadgar.internal` and the whole suite fails at DNS rather than at a
    # contract.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # (b) THE EDGE, AND ONLY THE EDGE. Selected by the Envoy Gateway labels
    # rather than by Service name: the live Service is
    # `envoy-yadgar-edge-a2648de2`, whose suffix is a hash that changes when the
    # Gateway is recreated. A policy naming the Service by name would silently
    # stop matching, and the suite would then be unable to reach the edge for a
    # reason nothing explains.
    #
    # 10443 IS THE PORT THAT ACTUALLY MATTERS, AND 443 IS KEPT BESIDE IT.
    # Measured 2026-09-05: `envoy-yadgar-edge-a2648de2` is `port 443 →
    # targetPort 10443 → nodePort 30443`, so the Envoy pods LISTEN ON 10443.
    # Egress is evaluated after DNAT on both Cilium and Calico — by the time the
    # policy sees the packet the Service port has already been translated to the
    # pod's `targetPort` — so a rule naming only 443 would refuse every
    # connection to the edge. Rule (c) below excepts the pod CIDR, so there is no
    # second path: the runner could not reach the edge at all. 443 stays because
    # a future stable Service, or a CNI that evaluates pre-DNAT, would use it,
    # and allowing a port the edge does not serve costs nothing. THIS FILE IS
    # DORMANT UNTIL THE CNI CHANGES, so the mistake would not surface until the
    # day the policy starts being enforced — which is why the reason is written
    # down here rather than left to be rediscovered.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: edge
              gateway.envoyproxy.io/owning-gateway-namespace: yadgar
      ports:
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 443

    # (c) GitHub, expressed as "the internet, but nothing in this cluster".
    #
    # NetworkPolicy has no FQDN rule, so "GitHub" is not directly sayable. The
    # portable form is an `ipBlock` of everything with the cluster's own ranges
    # excepted — which is coarser than GitHub and says so: a compromised runner
    # could reach any host on :443. Narrowing it needs an FQDN-aware policy
    # (Cilium), which is a decision that belongs with the CNI choice.
    #
    # THE THREE EXCEPTED RANGES WERE MEASURED (2026-09-05), not assumed. Pod
    # 10.244.0.0/16 (`.spec.podCIDR` per node, /24 each), Service 10.96.0.0/16
    # (`kubernetes` ClusterIP 10.96.0.1, kube-dns 10.96.0.10), node
    # 10.89.4.0/24 (the container network the kind nodes sit on). A wrong or
    # stale range here is a hole, so re-measure when the cluster is rebuilt.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16
              - 10.96.0.0/16
              - 10.89.4.0/24
      ports:
        - protocol: TCP
          port: 443
