name: smoke

# THE VERDICT AFTER EVERY ROLL. Ten rows, under a minute, run on the
# `estate-front` runner inside the cluster so that the traffic reaches the edge
# the way a real client's does.
#
# NEVER `pull_request`. A fork pull request executes attacker-chosen workflow
# code, and this workflow runs on a self-hosted runner inside the cluster,
# holding the runner's registration token and the `estate` environment gate. This
# clause used to add "and — until the CNI changes and C-18 goes green — line of
# sight to every service"; that half is deleted rather than quoted because it is
# no longer a reason for this trigger list. `estate-front-egress` is enforced and
# C-18 measures it green, so the runner does NOT have line of sight to every
# service. The registration token and the environment gate are reason enough on
# their own, and neither depends on the CNI.
# Three controls, and this trigger list is the first: `repository_dispatch`
# (`module-rolled`) and `workflow_dispatch`, and nothing else — the two the `on:`
# block below declares, neither of which a fork can reach. The second control is
# that the scale set is registered against THIS REPOSITORY rather than the
# organisation, so no other repository's workflow can target it. The third is
# that the `estate` environment is named by the suite workflows and by nothing
# else, and a fork pull request cannot read environment secrets at all.
#
# The design also named an organisation runner group restricted to this
# repository. There is no such group and there cannot be: `yadgarhq` is on the
# free plan, where `Default` is the only group and custom groups are a Team or
# Enterprise feature. The repository-scoped registration replaces it.
on:
  repository_dispatch:
    types: [module-rolled]
  workflow_dispatch:
    inputs:
      module:
        description: "The module that was rolled, if any. `gateway` can be confirmed from the front door; the other four cannot."
        type: string
        required: false
        default: ""
      tag:
        description: "The release tag that was rolled, e.g. v0.8.13."
        type: string
        required: false
        default: ""

# Rolls arrive back to back. Queue rather than cancel: a cancelled smoke run is
# a roll with no verdict, which is the thing this workflow exists to prevent.
concurrency:
  group: estate-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    # THE SCALE SET'S NAME IS THE LABEL. `estate-front` egresses only to kube-dns,
    # the edge, and GitHub — see `infra/estate-front/` in `yadgarhq/deploy`.
    # Until ARC is installed
    # this job has no runner and the run queues; that is stated in the README
    # rather than hidden.
    runs-on: estate-front
    # WHERE `ESTATE_PASSWORD` LIVES, and it must NOT require reviewers. Smoke
    # runs on `module-rolled`, and the promise is a verdict within minutes of
    # every roll — a reviewer-gated environment turns every roll into a job
    # waiting on a human. The control is WHICH WORKFLOWS may name the
    # environment, not a human approving each run.
    environment: estate
    timeout-minutes: 30
    # THE CAGE HAS NO CPU LIMIT, ONLY A MEMORY ONE. `estate-front`'s runner
    # pod is capped at 2Gi with no `cpu.max`, but cargo picks its build
    # parallelism from `nproc`, not from the cgroup — so with no CPU limit it
    # reads the host's core count (inferred from the absent `cpu.max`, not
    # measured inside the pod — it is ephemeral at `minRunners: 0`) and
    # launches that many parallel `rustc`
    # processes, each linking through its own thread pool, inside the 2Gi
    # cage. Under that load a linker thread-stack allocation hits the cage's
    # memory limit and `pthread_create` returns EAGAIN, which `ld` reports as
    # `signal 6 [Aborted]` — a linker abort, not an OOM kill, which is why it
    # reads like a compiler bug in `libc`/`quote` build scripts and is not.
    # Run 34644804350 failed this way. Capping the job's own parallelism
    # makes the build fit the cage as it stands today; it does not raise the
    # cage — that is the operator's separate, complementary change.
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # THROUGH THE ENVIRONMENT, NEVER INTERPOLATED INTO THE SCRIPT.
      # `client_payload` is written by whoever sent the dispatch, and `${{ }}`
      # inside a `run:` block is a shell injection — the class zizmor audits for.
      # Every value below is read as `$VAR` by a program that treats it as data.
      - name: wait for the rolled code, or say it could not be confirmed
        env:
          ESTATE_ROLLED_MODULE: ${{ github.event.client_payload.module || inputs.module }}
          ESTATE_ROLLED_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: cargo run --locked --bin await-roll

      # THE NINE ROWS. C-18 is not here; see the step below.
      #
      # `--ignored` is what runs them: every row is `#[ignore]` so the estate's
      # shared CI, which has no route to this cluster and no credential, does not
      # fail on the environment. `cargo test` still prints them as ignored there,
      # so the subset is visible rather than invisible.
      - name: the front-door contracts
        env:
          ESTATE_PASSWORD: ${{ secrets.ESTATE_PASSWORD }}
          ESTATE_PASSWORD_2: ${{ secrets.ESTATE_PASSWORD_2 }}
        run: cargo test --locked --test smoke -- --ignored --nocapture

      # C-18 REPORTS AS ITS OWN NAMED CHECK, and this step is that separation.
      #
      # THIS SAID "It is RED AT BIRTH: kindnet enforces no NetworkPolicy, so the
      # policy in `yadgarhq/deploy` is the specification this row tests rather than
      # something applied." The measurement was right and the inference from it was
      # wrong, and the old text is quoted rather than deleted so that a reader does
      # not re-measure the CNI, find kindnet, and derive the same conclusion again.
      # kindnetd `v20260528-9350166c` runs a `kube-network-policies` controller
      # (ledger 684). SIX RUNS OF THIS VERY STEP reported `ok` in exactly `18.02s`
      # — six 3000ms drops. The row has never been observed red.
      #
      # `continue-on-error` IS NOW UNJUSTIFIED BY ITS OWN ARGUMENT, and removing it
      # is deliberately NOT part of the prose correction. It was the compromise for
      # a standing red; there is no standing red. Dropping it makes C-18 able to
      # fail the workflow, which is a change in what a red smoke run means and is
      # the operator's call. `reference.toml` carries the same note about the three
      # stale deadline fields, whose task (ledger 614) is WITHDRAWN.
      - name: C-18 confinement (observed green; see reference.toml)
        id: confinement
        continue-on-error: true
        run: cargo test --locked --test confinement -- --ignored --nocapture

      - name: say what C-18 answered, on the run
        env:
          OUTCOME: ${{ steps.confinement.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### C-18 — front-door confinement"
            echo ""
            echo "Outcome: \`$OUTCOME\`."
            echo ""
            echo "This row has only ever been observed green, in exactly 18.02s — six 3000ms"
            echo "drops. A red here is a real regression, not the old \`kindnet enforces nothing\`"
            echo "expectation, which was false. See UNOBSERVED.md and reference.toml."
          } >> "$GITHUB_STEP_SUMMARY"
