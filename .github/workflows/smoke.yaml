name: smoke

# WHICH ROLL A RUN WAS ASKED ABOUT, ON THE RUNS LIST (ledger 675). `await-roll`
# now refuses a roll it cannot confirm, so a red run is either a refusal or a
# failing contract; the title is what tells a reader which roll it was before
# they open it. A `schedule` or `workflow_dispatch` run names no roll: it asks
# the `verdict` job about the settled estate instead (stage 5). Read from the
# payload and never executed: `run-name` is a title, not a shell.
run-name: >-
  smoke — ${{ github.event.client_payload.module || 'settled-state verdict' }}
  ${{ github.event.client_payload.tag }} (${{ github.event_name }})

# THE VERDICT AFTER EVERY ROLL. Ten rows, under a minute, run on the
# `estate-front` runner inside the cluster so that the traffic reaches the edge
# the way a real client's does.
#
# NEVER `pull_request`. A fork pull request executes attacker-chosen workflow
# code, and this workflow runs on a self-hosted runner inside the cluster,
# holding the runner's registration token and the `estate` environment gate. This
# clause used to add "and — until the CNI changes and C-18 goes green — line of
# sight to every service"; that half is deleted rather than quoted because it is
# no longer a reason for this trigger list. `estate-front-egress` is enforced and
# C-18 measures it green, so the runner does NOT have line of sight to every
# service. The registration token and the environment gate are reason enough on
# their own, and neither depends on the CNI.
# Three controls, and this trigger list is the first. THREE TRIGGERS, and
# nothing else: `repository_dispatch` (`module-rolled`), `workflow_dispatch` and
# `schedule` — none of which a fork can reach. A dispatch needs a credential
# with write on this repository. A `schedule` run executes the DEFAULT BRANCH's
# copy of this file, in this repository only; a fork's own schedules run in the
# fork, which has no access to the `estate-front` scale set or to this
# repository's environments. (This list read "`repository_dispatch` and
# `workflow_dispatch`, and nothing else" until ledger 675 stage 5 added the
# poll; the reason it gave still holds for the third trigger.)
#
# WHY `schedule` CANNOT REACH THE ROWS WITHOUT A GREEN VERDICT. On `schedule`
# and `workflow_dispatch` the `smoke` job runs only when the `verdict` job
# SUCCEEDED and output `run=true`, and `scripts/verdict.py` outputs that only
# for a green `settled-verdict` from argocd-verify's `settled.yaml` on `main`
# whose epoch `E = (K, A)` equals the epoch argocd `main` renders now, with no
# `smoke-certified-<E>` from an earlier run here. Anything else — no verdict, a
# red one, a token argocd-verify rejects, a mismatch on argocd `main` — leaves
# `run` false. `repository_dispatch` keeps its old path through `await-roll`
# until stage 7 retires it.
#
# THE `verdict-reader` ENVIRONMENT HOLDS A TOKEN THAT READS EVERY artifact and
# run log in `yadgarhq/argocd-verify` (ADR-0844: object names, uids and Secret
# NAMES, never Secret data — not only the verdicts). Its confinement holds
# under four conditions, and each one is load-bearing:
#   1. the environment's deployment policy is "Selected branches and tags" with
#      the single branch pattern `main` and no tag pattern;
#   2. no `pull_request_target` or `workflow_run` workflow ever names it;
#   3. the `verdict` job checks out no PR code and hands the token to no
#      third-party action — only to `scripts/verdict.py`;
#   4. the `verdict` job declares `contents: read, actions: read` and runs on
#      `ubuntu-latest`, so the token never enters a pod in the cluster.
# `scripts/tests/test_smoke_workflow.py` asserts 2, 3 and 4 and that this file
# names the environment exactly once; 1 is a repository setting
# (MIGRATION_NOTES item 8).
#
# GITHUB DISABLES A PUBLIC REPOSITORY'S SCHEDULES AFTER 60 DAYS without
# repository activity, and this repository is public. GitHub does not define
# 'repository activity'; workflow runs are reported not to count, so the
# conservative proxy is the age of the newest commit on estate `main`. The age
# of the newest `smoke.yaml` run would stay near zero right up to the day
# GitHub disables the schedule.
# Nothing here can notice its own schedule stopping. The guard belongs in
# argocd-verify's `settled.yaml` (private, so not subject to the rule; ledger
# 675 stage 3), and it must fail on the age of estate `main`'s newest COMMIT
# past 45 days. Re-enabling the schedule is manual and the only recovery
# (MIGRATION_NOTES item 8).
#
# The second control is
# that the scale set is registered against THIS REPOSITORY rather than the
# organisation, so no other repository's workflow can target it. The third is
# that the `estate` environment is named by the suite workflows and by nothing
# else, and a fork pull request cannot read environment secrets at all.
#
# The design also named an organisation runner group restricted to this
# repository. There is no such group and there cannot be: `yadgarhq` is on the
# free plan, where `Default` is the only group and custom groups are a Team or
# Enterprise feature. The repository-scoped registration replaces it.
on:
  repository_dispatch:
    types: [module-rolled]
  # THE POLL (ledger 675 stage 5). Every 15 minutes the `verdict` job asks
  # whether argocd-verify judged the current render epoch green; the rows run
  # once per epoch, not once per poll, because `smoke-certified-<E>` records it.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      recertify:
        description: "Run the rows again for an epoch an earlier run already certified (a flaky red, for example). Still needs a green verdict."
        type: boolean
        required: false
        default: false
      token_probe:
        description: "Which token reads argocd-verify. `real` is the only useful value outside the two live red checks: `own-github-token` must end red on 404, `bogus` red on 401."
        type: choice
        required: false
        default: real
        options: [real, own-github-token, bogus]

# Rolls arrive back to back. Queue rather than cancel: a cancelled smoke run is
# a roll with no verdict, which is the thing this workflow exists to prevent.
concurrency:
  group: estate-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # THE ONLY JOB THAT NAMES `verdict-reader` — see the third paragraph above.
  # It decides, it does not test: `scripts/verdict.py` computes the epoch from
  # public argocd `main`, runs the allow-list and pin checks, reads the newest
  # `settled-verdict` for that epoch with the read-only token, and passes the
  # `smoke` job only what it decided. Never the token.
  verdict:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: verdict-reader
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists this repository's own `smoke-certified-` artifacts and runs.
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      epoch: ${{ steps.decide.outputs.epoch }}
      verdict_url: ${{ steps.decide.outputs.verdict_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # Before the token exists in any step's environment.
      - name: install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: decide whether the rows run
        id: decide
        env:
          VERDICT_TOKEN: ${{ secrets.ARGOCD_VERIFY_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TOKEN_PROBE: ${{ inputs.token_probe }}
          RECERTIFY: ${{ inputs.recertify }}
          ESTATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/verdict.py

  smoke:
    needs: [verdict]
    # `always()` because `verdict` is SKIPPED on `repository_dispatch`, and a
    # skipped need skips its dependants unless the condition says otherwise.
    # On the other two triggers the rows run only on a decided `run=true`.
    # `needs.verdict.result == 'success'` repeats what `run == 'true'` already
    # implies today (`decide` is the job's last step, and `verdict.py` writes
    # `run=false` on every refusal). It is kept as the card's condition so that a
    # step added after `decide` cannot fail and still leave `run=true` standing.
    if: >-
      always() && ((github.event_name == 'repository_dispatch') ||
      (needs.verdict.result == 'success' && needs.verdict.outputs.run == 'true'))
    # THE SCALE SET'S NAME IS THE LABEL. `estate-front` egresses only to kube-dns,
    # the edge, and GitHub — see `infra/estate-front/` in `yadgarhq/deploy`.
    # Until ARC is installed
    # this job has no runner and the run queues; that is stated in the README
    # rather than hidden.
    runs-on: estate-front
    # WHERE `ESTATE_PASSWORD` LIVES, and it must NOT require reviewers. Smoke
    # runs on `module-rolled`, and the promise is a verdict within minutes of
    # every roll — a reviewer-gated environment turns every roll into a job
    # waiting on a human. The control is WHICH WORKFLOWS may name the
    # environment, not a human approving each run.
    environment: estate
    timeout-minutes: 30
    # THE CAGE HAS NO CPU LIMIT, ONLY A MEMORY ONE. `estate-front`'s runner
    # pod is capped at 2Gi with no `cpu.max`, but cargo picks its build
    # parallelism from `nproc`, not from the cgroup — so with no CPU limit it
    # reads the host's core count (inferred from the absent `cpu.max`, not
    # measured inside the pod — it is ephemeral at `minRunners: 0`) and
    # launches that many parallel `rustc`
    # processes, each linking through its own thread pool, inside the 2Gi
    # cage. Under that load a linker thread-stack allocation hits the cage's
    # memory limit and `pthread_create` returns EAGAIN, which `ld` reports as
    # `signal 6 [Aborted]` — a linker abort, not an OOM kill, which is why it
    # reads like a compiler bug in `libc`/`quote` build scripts and is not.
    # Run 34644804350 failed this way. Capping the job's own parallelism
    # makes the build fit the cage as it stands today; it does not raise the
    # cage — that is the operator's separate, complementary change.
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      # THROUGH THE ENVIRONMENT, NEVER INTERPOLATED INTO THE SCRIPT.
      # `client_payload` is written by whoever sent the dispatch, and `${{ }}`
      # inside a `run:` block is a shell injection — the class zizmor audits for.
      # Every value below is read as `$VAR` by a program that treats it as data.
      # A ROLL THIS STEP CANNOT CONFIRM FAILS IT, and the rows do not run
      # (ledger 675). It used to print "could not confirm" and exit 0, so the
      # rows certified the previous pods and the run went green — six measured
      # false greens. Nothing reads this workflow's conclusion but a person.
      #
      # ON `repository_dispatch` ONLY. On the other two triggers the `verdict`
      # job already established that the estate settled on the current render,
      # which is a stronger statement than this step can make.
      - name: wait for the rolled code, or refuse a verdict it cannot confirm
        if: github.event_name == 'repository_dispatch'
        env:
          ESTATE_ROLLED_MODULE: ${{ github.event.client_payload.module }}
          ESTATE_ROLLED_TAG: ${{ github.event.client_payload.tag }}
        run: cargo run --locked --bin await-roll

      - name: say which epoch this run certifies
        if: github.event_name != 'repository_dispatch'
        env:
          EPOCH: ${{ needs.verdict.outputs.epoch }}
          VERDICT_URL: ${{ needs.verdict.outputs.verdict_url }}
        run: |
          set -euo pipefail
          printf '### settled-state epoch\n\nEpoch %s, verdict %s\n' "$EPOCH" "$VERDICT_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      # THE NINE ROWS. C-18 is not here; see the step below.
      #
      # `--ignored` is what runs them: every row is `#[ignore]` so the estate's
      # shared CI, which has no route to this cluster and no credential, does not
      # fail on the environment. `cargo test` still prints them as ignored there,
      # so the subset is visible rather than invisible.
      - name: the front-door contracts
        env:
          ESTATE_PASSWORD: ${{ secrets.ESTATE_PASSWORD }}
          ESTATE_PASSWORD_2: ${{ secrets.ESTATE_PASSWORD_2 }}
        run: cargo test --locked --test smoke -- --ignored --nocapture

      # C-18 REPORTS AS ITS OWN NAMED CHECK, and this step is that separation. It
      # is kept so that a reader of a run sees the confinement verdict without
      # reading the suite's; it is no longer protecting the suite from a standing
      # red, because there was never a standing red to protect it from.
      #
      # THIS SAID "It is RED AT BIRTH: kindnet enforces no NetworkPolicy, so the
      # policy in `yadgarhq/deploy` is the specification this row tests rather than
      # something applied." The measurement was right and the inference from it was
      # wrong, and the old text is quoted rather than deleted so that a reader does
      # not re-measure the CNI, find kindnet, and derive the same conclusion again.
      # kindnetd `v20260528-9350166c` runs a `kube-network-policies` controller
      # (ledger 684). NINETEEN RUNS OF THIS VERY STEP, on three separate days,
      # reported `ok` in exactly `18.02s` — six 3000ms drops against the six
      # addresses the four targets then declared resolve to. The row has never been
      # observed red. `reference.toml` lists the nineteen run ids. Ledger 751 added
      # three targets: seven on ten addresses, so all-dropped is now about 30.0s.
      #
      # `continue-on-error` IS GONE (ADR-0687). This step used to carry it, with the
      # note "removing it is deliberately NOT part of the prose correction … the
      # operator's call". The call is made: the excuse was the compromise for a
      # standing red, there is no standing red, and a check that cannot fail the
      # workflow reports nothing. C-18 is an ORDINARY HARD CHECK — a red here fails
      # this run, which is the point. The runtime is what makes that safe to gate on:
      # had any target accepted, the connect would return at once, the row would fail,
      # and the step would finish early — about 27s rather than 30.0s for the
      # seven-target list (about fifteen rather than 18.02s for the old four).
      - name: C-18 confinement — nothing inside the cluster is reachable
        id: confinement
        run: cargo test --locked --test confinement -- --ignored --nocapture

      # `if: always()` IS WHAT `continue-on-error` USED TO DO FOR THIS STEP. With the
      # excuse dropped, a failing C-18 aborts the job — and without this condition the
      # summary would vanish in exactly the run a person needs it. `outcome` is the
      # step's own result and reads `failure` here, so the summary states the red
      # rather than inheriting a job-level one.
      - name: say what C-18 answered, on the run
        if: always()
        env:
          OUTCOME: ${{ steps.confinement.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### C-18 — front-door confinement"
            echo ""
            echo "Outcome: \`$OUTCOME\`."
            echo ""
            if [ "$OUTCOME" = skipped ] || [ "$OUTCOME" = cancelled ]; then
              echo "C-18 did NOT run: an earlier step failed or the run was cancelled — the"
              echo "checkout or toolchain, the roll confirmation, the front-door contracts, or"
              echo "the 30-minute timeout. This says nothing about confinement."
              exit 0
            fi
            echo "This row has only ever been observed green: nineteen runs at 18.02s, six"
            echo "3000ms drops on the old four targets. Seven targets on ten addresses is about"
            echo "30.0s. It is an ordinary hard check: a red here fails this"
            echo "run and is a real regression, not the old \`kindnet enforces nothing\`"
            echo "expectation, which was false. There is no deadline behind it and nothing to"
            echo "wait for. See UNOBSERVED.md and reference.toml."
          } >> "$GITHUB_STEP_SUMMARY"

      # ONE CERTIFICATE PER EPOCH, PASS OR FAIL. `scripts/verdict.py` skips an
      # epoch that has one, so the poll runs the rows once per render rather
      # than every 15 minutes. Uploaded on a red too: re-running on every poll
      # after a real failure would turn it into a red every 15 minutes. A flaky
      # red therefore blocks automatic re-runs for that epoch until someone
      # dispatches with `recertify`. `!cancelled()` rather than `always()`: a
      # cancelled run certified nothing, and must not block the next poll.
      - name: write the certificate
        if: "!cancelled() && github.event_name != 'repository_dispatch'"
        env:
          EPOCH: ${{ needs.verdict.outputs.epoch }}
          VERDICT_URL: ${{ needs.verdict.outputs.verdict_url }}
          CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          printf 'epoch %s\nverdict %s\nconclusion %s\n' "$EPOCH" "$VERDICT_URL" "$CONCLUSION" > "$RUNNER_TEMP/smoke-certified.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "!cancelled() && github.event_name != 'repository_dispatch'"
        with:
          name: smoke-certified-${{ needs.verdict.outputs.epoch }}
          path: ${{ runner.temp }}/smoke-certified.txt
          if-no-files-found: error
