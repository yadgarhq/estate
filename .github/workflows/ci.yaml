name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies.
#
# NO WORKFLOW-LEVEL `permissions:` BLOCK, deliberately. A job cannot ask for more
# than the workflow grants, so a top-level `contents: read` makes the release
# job's `packages: write` invalid — and the failure is a run with ZERO JOBS and
# no logs, which says nothing about permissions. Each job states its own instead.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # THE PULL REQUEST GATE, AND IT CARRIES NO CREDENTIAL (ADR-0560). `ci-pr.yaml`
  # serves both events; one job calling it for both would hand the release App's
  # private key to every pull-request run, which builds and tests the branch's
  # own code. The pull request has no use for it: `version` is the only job that
  # reads those secrets and its own condition is `push` to `refs/heads/main`.
  #
  # THE NAME `ci` IS LOAD-BEARING. The ruleset on `main` requires the check
  # `ci / passed`, which is `<caller job id> / <called job id>` — renaming this
  # job breaks the merge gate rather than reporting anything.
  ci:
    if: github.event_name == 'pull_request'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read

  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed
  # and where nothing unreviewed runs. A push to `main` here is a merge that has
  # already passed `ci / passed`; the ruleset forbids any other kind.
  #
  # NAMED RATHER THAN `secrets: inherit`: zizmor's `secrets-inherit` audit fails
  # inherit at High confidence, and it is right about why — inherit passes every
  # organisation and repository secret the caller can see, and it grows silently
  # as secrets are added to the organisation later.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # THE TAG PATH. `ci-release.yaml`'s `deployment` job writes a released image
  # digest into `versions/<module>.yaml` in `yadgarhq/argocd`. This repository
  # ships no image, so that half is inert here — but the call is declared in the
  # same shape as every other repository, because a repository whose release path
  # differs from the estate's is one nobody checks.
  #
  # NO RELEASE WILL HAPPEN YET. This repository carries no tag, and the version
  # job refuses to compute a bump from no baseline and says so.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: yadgarhq/actions/.github/workflows/ci-release.yaml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
