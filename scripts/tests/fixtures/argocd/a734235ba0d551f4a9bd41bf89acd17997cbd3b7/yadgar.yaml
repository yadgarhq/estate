# THE WHOLE OF YADGAR FOR THIS ORGANISATION: the parent chart's own
# `example/application.yaml` at the pinned tag, with this organisation's values
# inlined as `valuesObject` (ADR-0786, ADR-0803 option A).
#
# ADOPTED FROM yadgarhq/deploy's `infra/yadgar-app.yaml` at 05b160b, WHEN
# `infra` RETIRED (ADR-0828). Root adopts the live Application by name, keeping
# its uid. What the move changed, and only this:
#
#   - `sources` (the OCI chart plus `ref: self` on yadgarhq/deploy, reading
#     `$self/infra/yadgar/values.yaml`) became ONE `source`, the same chart at
#     the same `targetRevision`.
#   - That values file is inlined below under `valuesObject` IN FULL, comments
#     included. Its comments are carried verbatim from deploy, so the
#     `infra/...` paths and `scripts/tests/test_no_two_owners.py` they name
#     are deploy's at 05b160b; the gate now lives here, in
#     `scripts/gates/test_no_two_owners.py`. The values hold no `null`, so
#     `valuesObject` carries them whole.
#   - `syncPolicy` is S0: no `automated.prune` (see the comment on that block),
#     and the example's bounded `retry`.
#
# Every rendered object was unchanged by the move: 88 objects, 0 differing
# (render gate). That count is the adoption's, not today's: the render gate's
# `EXPECTED_OBJECTS` and `yadgar_render.sha256` hold the current one.
#
# GATED, NOT ONLY WRITTEN DOWN. `scripts/gates/test_yadgar_application.py`
# asserts that this file equals `yadgarhq/chart@v<targetRevision>`'s
# `example/application.yaml` everywhere outside `spec.syncPolicy` and
# `spec.source.helm.valuesObject`, and that the render at the pin equals the
# committed per-object digests in `scripts/gates/yadgar_render.sha256` (K3).
# A pin bump therefore moves, in one merge, `targetRevision` below,
# `scripts/chart_pin.json` (`chart_tag`, `chart_digest`) and that digest table,
# and, when the parent carries a new `platform`, every operator Application's
# `targetRevision` and `chart_pin.json`'s `platform_version` with them
# (`pin_bump.pin_files`). `check_chart_pin.py` and
# `scripts/tests/test_operator_applications.py` refuse a partial move.
#
# THE EXAMPLE'S OWN COMMENTS BELOW ARE AN ADOPTER'S. Where they say "EDIT
# THIS" or "in your copy", this file is that copy.
#
# NO SYNC WAVE ON THIS APPLICATION, AS IN DEPLOY AND IN THE EXAMPLE. Its
# module objects carry none either; a module pod started before its database
# or certificate exists waits in `ContainerCreating`, slower rather than broken.
# The ONE exception is inside the chart: the seeder's `Job/seeder` and
# `ConfigMap/seeder-registry` carry `argocd.argoproj.io/sync-wave: "1"`, so the
# sync runs after `project` and `project-db` are healthy (ADR-0940).
#
# NO `Replace=true` AND NO `ServerSideApply=true` IN THIS APPLICATION'S
# `syncOptions`, per D83: either one would let an immutable-field change become
# a delete-and-recreate of a live Service. The seeder chart sets
# `Replace=true,Force=true` on `Job/seeder` ALONE, per resource: a Job's pod
# template is immutable, so each sync deletes and re-creates that Job, and with
# it the previous run's pod and log.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yadgar
  # ARGO'S namespace, not the workload's. `destination.namespace` below is where
  # the objects land.
  namespace: argocd
spec:
  # CHANGE THIS if your Argo uses a project other than `default`.
  project: default
  source:
    repoURL: ghcr.io/yadgarhq/charts
    chart: yadgar
    # EDIT THIS, and bump it deliberately. This is the line an upgrade moves.
    # BARE SEMVER, no leading `v`: the git tag is `vX.Y.Z`, the chart version
    # `X.Y.Z`. 0.3.5 was the first release whose platform, gateway and iam read
    # `global.hostname` (ADR-0808). In this repository the release tooling
    # stamps this line, `kind/application.yaml`'s and the `platform` pin of
    # `operators-application.yaml` in the commit each tag points at (ADR-0820),
    # so each tag's examples pin that tag. In your copy, you move it.
    targetRevision: 0.50.0
    helm:
      valuesObject:
        # THIS ORGANISATION'S VALUES FOR THE PARENT CHART, READ BY infra/yadgar-app.yaml
        # AS `$self/infra/yadgar/values.yaml`.
        #
        # ADR-0786: any divergence between this organisation's estate and an adopter's
        # must be expressible as a difference between two values files, so it is a
        # visible render diff rather than invisible drift. This file IS that difference.
        # Nothing environment-specific belongs anywhere else.
        #
        # NOT READ BY THE `infra` APP-OF-APPS. It sources `path: infra` with no
        # `directory.recurse`, so a file one directory down is invisible to it — the same
        # reason `infra/databases/` holds manifests that only the `databases` Application
        # reads. A values file directly in `infra/` would be applied as a manifest.
        #
        # DERIVED FROM EACH MODULE CHART'S OWN VALUES AND SCHEMA (ADR-0751, ADR-0619),
        # never copied from another Application's values. A key below either turns ON
        # something the chart ships OFF, so an omission PRUNES a live object, or states
        # a setting the chart requires and does not default (ADR-0845).
        #
        # MEASURED 2026-09-26 against the published `yadgar:0.2.38`, the version
        # `infra/yadgar-app.yaml` pins rather than the newest published one (digest
        # sha256:38847bbbdda01657f3a2d259c423e4c1c9e36a3310c8d7698c0b380ac18d3b32):
        # this file renders 51 objects, three of them `MariaDB`. It rendered 48 and
        # ZERO MariaDB until merge B of `plans/the-mariadb-crs-into-the-chart.md` set
        # the three `database.create` toggles below true. The three rendered specs are
        # identical to the three live CRs' last-applied specs — 0 differing fields over
        # 3 instances, that plan's M2 gate — and each rendered object carries
        # `helm.sh/resource-policy: keep` and
        # `argocd.argoproj.io/sync-options: Prune=false`, which is M2a at 6 over 3.
        #
        # 64 OBJECTS AS OF STEP 5 of `plans/retiring-the-deploy-copies.md`, measured
        # 2026-09-27 at the same pin and digest. `platform.internalCA.create` and
        # `platform.certificates.create` below add exactly 13 — Certificate and Issuer
        # `yadgar-internal-ca`, Issuer `yadgar-internal-selfsign` and the ten leaf
        # Certificates — and change 0 lines in the other 51.
        #
        # 70 OBJECTS AS OF STEP 6's FIRST MERGE, measured 2026-09-27 at the same pin
        # and digest. `platform.nats.create` below adds exactly 6 — `StatefulSet`,
        # `Service`, `PodDisruptionBudget` `yadgar-nats`, `Service/yadgar-nats-headless`,
        # `ConfigMap/yadgar-nats-config` and `NetworkPolicy/nats-ingress` — and changes
        # 0 of the other 64. No Deployment changes, so no existing pod rolls.
        #
        # STILL 70 AS OF STEP 6's SECOND MERGE, measured 2026-09-27 at the same pin and
        # digest. The two `nats.url` lines below change exactly 2 lines of the render —
        # the `NATS_URL` value in `Deployment/iam` and in `Deployment/gateway` — and
        # add or remove no object. Both Deployments roll.
        #
        # STILL 70 AS OF STEP 6's THIRD MERGE, byte-identical: that merge deletes
        # `infra/nats.yaml` and does not touch this file.
        #
        # STILL 70 AS OF B5 of `plans/the-one-application-install.md`, measured
        # 2026-09-27 against `yadgar:0.2.42` (digest sha256:5b092b8d…): the bump and
        # this file's two deleted `nats.url` lines remove the five `yadgar-nats*`
        # broker objects, add the same five as `nats*` with every other field equal,
        # and move `NATS_URL` in `Deployment/iam` and `Deployment/gateway` to
        # `nats://nats:4222`. The other 63 objects are byte-identical. Both
        # Deployments roll.

        # ── THE ESTATE'S HOSTNAME, STATED ONCE (ADR-0808) ────────────────────────────
        # `platform` (the Gateway listener and the edge Certificate), `gateway` (the
        # HTTPRoute) and `iam` (the enrolment URL) derive their hostnames from this key
        # when their own keys are empty, which they are here. Empty, it renders the same
        # `gateway.yadgar.internal` in all five places, so stating it changes no object:
        # measured 2026-09-27 at the pinned 0.3.7. It is stated because it is THIS
        # organisation's edge name, and it must agree with the root CA's nameConstraints.
        global:
          hostname: gateway.yadgar.internal

        # ── GATEWAY ──────────────────────────────────────────────────────────────────
        # GATEWAY HAS NO TLS LISTENER of its own: Envoy terminates the edge's TLS and
        # forwards to gateway in cleartext, so the chart reads no `gateway.tls`.
        # `iam.tls.enabled`, `task.tls.enabled` and `project.tls.enabled` below are
        # DIALS — whether gateway speaks TLS TO that module. Each is stated here
        # rather than left to a chart default (ADR-0845).
        #
        # `networkPolicy` IS THE EDGE'S INGRESS ALLOW-LIST, AS OF STEP 8 of
        # `plans/retiring-the-deploy-copies.md` (ADR-0685's recorded alternative: a
        # `from` supplied by values). The merge that set it deleted
        # `infra/network-policies-app.yaml` and `infra/network-policies/gateway-ingress.yaml`,
        # whose spec the chart now renders field for field under the same name; the
        # chart adds only the label `app: gateway`. `deploy#70` put `Prune=false` on the
        # copy one merge ahead, so the handover is an adoption.
        #
        # THE PEER IS DERIVED FROM THE GATEWAY'S NAME. Envoy Gateway stamps
        # `owning-gateway-name`/`-namespace` from `Gateway/edge`, which `platform`
        # renders from `platform.gatewayListener.gatewayName` (default `edge`) into
        # this release's namespace. Rename either and this peer selects no pod: every
        # external call times out while every pod stays Ready (ADR-0685). Change the
        # two in one diff. The chart refuses an enabled policy with no `clients`,
        # rather than rendering an allow-all.
        gateway:
          autoscaling: { enabled: true }
          sourceAddress: { trustedProxyHops: "" }
          adminBootstrap: { tokenSecret: admin-bootstrap-token }
          # PROJECT VALIDATION IS ENFORCING (ADR-0967, which supersedes ADR-0841's
          # `counting` hold after the clean observation window and the pre-flip
          # gate). The gateway chart ships
          # `counting`, which counts would-be refusals and serves the call;
          # `enforcing` answers them (400 with the reason token, 403 for
          # PROJECT_NOT_MEMBER, 503 before the registry first loads) and makes the
          # resolved-path stamping of ADR-0961 active. Rollback is a revert of the
          # merge that set it, never this line alone: the revert also restores the
          # render table and deletes the two tests below, which would otherwise
          # stay red. `registryPollSeconds` keeps the chart's 60. Pinned offline by
          # `scripts/tests/test_project_validation_mode.py` and on the render by
          # `scripts/gates/test_project_validation_render.py`.
          # ORG GRANTS ARE ENFORCING (team access stage 12, ADR-0963 (4); plans/team-access.md).
          # `orgGrants` is the grant refusal's own knob, apart from `mode`. `counting`
          # counted the no_grant and read_only arms and served the call; `enforcing`
          # answers them (403 PROJECT_NOT_MEMBER, 403 PROJECT_READ_ONLY). Rollback:
          # set `orgGrants` back to `counting` and put the `mode`-only test pins back;
          # no data change.
          projectValidation: { mode: enforcing, orgGrants: enforcing }
          gateway: { enabled: true } # the HTTPRoute
          iam: { tls: { enabled: true } } # DIAL to iam
          task: { tls: { enabled: true } } # DIAL to task
          project: { tls: { enabled: true } } # DIAL to project
          # THE CLIENT LEAF EACH CALLER PRESENTS ON ITS DIALS (ledger 770, ADR-0852).
          # `platform` issues `gateway-client-tls`, `iam-client-tls`, `task-client-tls`
          # and `project-client-tls`. This value and `iamDb`, `taskDb` and `projectDb`
          # `.tls.clientCertSecret` below mount each into its caller. EVERY SERVER NOW
          # REQUIRES ONE: B-U9 (ledger 925) moved all six `tls.clientAuth` from `off`
          # through `optional` to `required` (see the six services below), so a
          # caller presenting the wrong leaf, or none, now fails the handshake.
          clientCertificate: { secret: gateway-client-tls }
          networkPolicy:
            enabled: true
            clients:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: envoy
                    gateway.envoyproxy.io/owning-gateway-name: edge
                    gateway.envoyproxy.io/owning-gateway-namespace: yadgar
            scrapeFrom: { namespace: observability }
          # NO `nats.url`, AS OF B5: the module default `nats://nats:4222` names the
          # parent's broker, which `platform` renders as `nats` from 0.1.15
          # (`fullnameOverride`, ADR-0805; parent 0.2.42 pins 0.1.17). See
          # `platform.nats` below.
          #
          # THE NATS AND VALKEY DIALS STATE THEIR TLS SWITCH, NEVER DEFAULT IT (ADR-0845,
          # ADR-0852, PB-3). gateway 0.12.0 and iam 0.11.0 require `nats.tls.enabled`
          # (and gateway `valkey.tls.enabled`) with no default, so the keys move with
          # the pin that first requires them. `false` is today's posture: each renders
          # `NATS_TLS_ENABLED`/`VALKEY_TLS_ENABLED` as "0" and no CA or certificate
          # mount. The hop steps after PB-3 (B-N4.x, B-V4.x) turn them on one at a time.
          #
          # B-N4.2 (ledger 925): THE BROKER HOP DIALS WITH TLS. `NATS_TLS_ENABLED` "1",
          # the broker's CA from `nats-tls` (`ca.crt`, the chart's default
          # `nats.tls.caSecret`), and the one shared `clientCertificate.secret` leaf
          # presented to it. The broker still admits plaintext until B-N4.3.
          nats: { tls: { enabled: true } }
          #
          # B-V4.2 (ledger 925): THE CACHE HOP DIALS WITH TLS. `VALKEY_TLS_ENABLED` "1",
          # the cache's CA from `valkey-tls` (`ca.crt`, the chart's default
          # `valkey.tls.caSecret`), and the same shared `clientCertificate.secret`
          # leaf. gateway 0.12.0 keeps the host of `rateLimit.addr` and dials the TLS
          # listener on the fixed port 6380, never the 6379 the address names. valkey
          # still serves plaintext 6379 until B-V4.3.
          valkey: { tls: { enabled: true } }

        # ── THE SIX SERVICES ─────────────────────────────────────────────────────────
        # `scrapeFrom.namespace: observability` is where Prometheus runs; each module's
        # `clients` list is the one service entitled to dial it.
        #
        # EACH SERVER'S `tls.clientAuth` IS STATED, NEVER DEFAULTED (ADR-0854, ledger
        # 925). `"off"` is quoted: a bare `off` is YAML 1.1's false, which the chart
        # refuses by name. The binary refuses an absent value at boot even with TLS
        # off, so the six keys move with the pin that first requires them (PB-2).
        #
        # THE CLIENT CA IS STAGED NOW, WHILE THE MODE IS STILL `"off"` (ADR-0883).
        # `clientCaSecret` names the server's OWN cert-manager leaf `<server>-tls`.
        # Its `ca.crt` is the CA that issued the four `*-client-tls` leaves. The chart
        # mounts it as a `client-ca` volume that is NOT optional, so a wrong name
        # fails at this step (`FailedMount`), not at the later flip to `optional`.
        # Under `"off"` the server loads no client CA and asks no caller for a
        # certificate. The CA root's own Secret holds the CA private key; it is never
        # named here, and the parent chart refuses it.
        #
        # ONE HOP AT A TIME, `"off"` → `"optional"` → `"required"` (ADR-0852, B-U8,
        # B-U9). Under `"optional"` the server reads the CA file and watches it, asks
        # every caller for a certificate, accepts a caller that sends none, and
        # refuses a certificate the CA did not issue. It is a staging step, not a
        # control: anyone can send no certificate. `task-db` is first (B-U8a), as
        # its only caller is `task`, which presents `task-client-tls` (ledger 770).
        # `iam-db` and `project-db` are second (B-U8b): each has one caller, `iam`
        # and `project`, which present `iam-client-tls` and `project-client-tls`.
        # `project` is third (B-U8c): its one caller is `gateway`, which presents
        # `gateway-client-tls` (the edge's `gateway-tls` is a different leaf).
        # `task` is fourth (B-U8d): its one caller is `gateway`, which presents
        # the same `gateway-client-tls`. `iam` is fifth and last (B-U8e): its one
        # caller is `gateway`, which presents the same `gateway-client-tls`.
        #
        # Under `"required"` a caller that sends no certificate is refused too, so
        # a caller that stops presenting its leaf on that hop is an outage. The
        # first two are `iam-db` and `project-db` (B-U9): each has one caller and
        # steady passive traffic, so a refused leaf shows within minutes. `task-db`
        # waited at `"optional"`: its hop carries no request without an operator
        # call. `project` is third (B-U9): its one caller is `gateway`, and each
        # gateway pod's 60 s registry poll (`ListProjects`) is its passive signal.
        # It is the first hop where the gateway's `gateway-client-tls` is required.
        # `task-db` is fourth (B-U9): operator `find_tasks` calls crossed `task` →
        # `task-db` OK under `"optional"` (ADR-0884), so its one caller's
        # `task-client-tls` crossed OK under `"optional"` there. With no passive traffic, a refused
        # leaf shows only at the next request, and then every task call fails.
        # `task` is fifth (B-U9.4): its one caller is `gateway`, and operator
        # `find_tasks` calls crossed `gateway` → `task` OK under `"optional"`
        # (ADR-0884). This hop also has no passive traffic, so a refused
        # `gateway-client-tls` shows only at the next task tool call.
        # `iam` is sixth and last (B-U9.5): its one caller is `gateway`, and
        # operator logins and the `ResolveCredential` calls behind them crossed
        # `gateway` → `iam` OK under `"optional"` (ADR-0884). A refused leaf
        # fails every login at once, and every authenticated request once the
        # gateway's 300 s credential cache expires.
        iam:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: iam-tls
            clientCaSecretKey: ca.crt
          iamDb: { tls: { enabled: true, clientCertSecret: iam-client-tls } }
          # THE ENROLMENT URL KEEPS ITS PORT, AND `global.hostname` ABOVE WOULD DROP
          # IT. With `global.hostname` set and this key empty, iam derives
          # `https://gateway.yadgar.internal` with NO port (ADR-0808: an edge on 443).
          # This cluster's edge is reached from the host on 18443 (kind's mapping to
          # node port 30443), and `ENROLMENT_GATEWAY` renders
          # `https://gateway.yadgar.internal:18443` today, from the chart's no-hostname
          # fallback. Stated here, so every enrolment token keeps the address a client
          # can reach. Measured 2026-09-27 at the pinned 0.3.7: without this line,
          # `global.hostname` changes exactly this one env value and rolls `iam`.
          enrolment: { gateway: "https://gateway.yadgar.internal:18443" }
          # NO `nats.url`, AS OF B5; see `gateway` above. `nats.tls.enabled` is stated
          # for the same reason as gateway's (PB-3); iam's NATS client identity is its
          # own `nats.tls.clientCertSecret` (ADR-0885), default `iam-client-tls`, on its
          # own mount. B-N4.2 (ledger 925) turns it on, with the CA from `nats-tls`.
          nats: { tls: { enabled: true } }
          # ADMIN IS MEMBERSHIP OF `administrators` (team access stage 10, ADR-0962,
          # ADR-0963). Renders `IAM_ADMIN_FROM_TEAM=true`: iam answers `is_admin` from
          # the declared, live `administrators` team under `seeder.registry.teams`
          # below, not from the `iam_user.is_admin` column. `SetUserAdmin`, and
          # `CreateUser` with `is_admin` true, are refused `FAILED_PRECONDITION`. The
          # chart ships `false`. The stage 10 preconditions, measured read-only on
          # 2026-10-25, are in the pull request that set this. Rollback is a revert of
          # that merge, which restores the chart's `false` and deletes the two tests
          # below; on kind-yadgar Max's column is still true, so his `/admin` returns.
          # Pinned offline by `scripts/tests/test_iam_admin_from_team.py` and on the
          # render by `scripts/gates/test_iam_admin_from_team_render.py`.
          adminFromTeam: true
          # KEY-IDENTITY ADOPTION IS ON (ADR-1085, ADR-1089, ADR-1091). Renders
          # `KEY_IDENTITY_ADOPT=adopt`: after the proof passes, iam calls
          # `AdoptKeyIdentity` and records the marker. A failed proof ends the serve on
          # every pod. The chart ships `observe`. Set only after the iam log showed
          # `OBSERVE: the adoption proof PASSED`; the evidence is in the pull request
          # that set this. A revert stops further adoption but does not remove a marker.
          keyIdentity: { adopt: "adopt" }
          # `seeder` JOINS `gateway` ONCE `teams` IS DECLARED (team access stage 7):
          # the seeder Job sends `SyncTeams` to iam before `SyncProjects` to
          # `project`. This list REPLACES the chart's `[gateway]`; it does not add to
          # it. `INGRESS_PEERS` in `scripts/gates/test_yadgar_application.py` pins it.
          networkPolicy:
            {
              enabled: true,
              clients: [gateway, seeder],
              scrapeFrom: { namespace: observability },
            }

        iam-db:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: iam-db-tls
            clientCaSecretKey: ca.crt
          networkPolicy:
            {
              enabled: true,
              clients: [iam],
              scrapeFrom: { namespace: observability },
            }
          # `create: true` IS MERGE B OF `plans/the-mariadb-crs-into-the-chart.md`, and
          # it is the flip the `className` line below was written for. Merge A deleted
          # `infra/databases-app.yaml` one merge earlier, so `iam-db-mariadb` is live
          # and owned by NOBODY at this point; this line is what makes the `yadgar`
          # Application render it and adopt it by rewriting one annotation. The apply
          # touches no spec field — the rendered spec equals the live last-applied spec
          # on every field, which is the plan's M2 gate and is what the pre-merge render
          # measures.
          #
          # THE `className` LINE IS WHAT MAKES THAT ADOPTION POSSIBLE RATHER THAN
          # REFUSED. `spec.storage.storageClassName` carries `webhook:"inmutable"` on
          # mariadb-operator 26.6.0, and the operator's `inmutable_webhook.go` compares
          # old and new with `reflect.DeepEqual` — so REMOVING a set field is a change
          # and is REFUSED.
          #
          # The chart's shipped default is EMPTY on purpose, because `standard` is kind's
          # local-path class and on any other cluster it leaves the PVC `Pending`
          # forever with nothing refusing. Empty renders NO `storageClassName` field, so
          # the target cluster's own default class binds.
          #
          # This cluster's three live CRs carry `standard`. Measured 2026-09-26 on
          # `yadgar:0.2.36`: WITHOUT these three lines the render omits the field on all
          # three instances and the adoption apply asks the webhook to unset it. WITH
          # them, 3 of 3 carry `storageClassName: standard` and the rendered spec differs
          # from the live last-applied spec in 0 fields.
          database:
            create: true
            instance:
              storage:
                className: standard

        task:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: task-tls
            clientCaSecretKey: ca.crt
          taskDb: { tls: { enabled: true, clientCertSecret: task-client-tls } }
          networkPolicy:
            {
              enabled: true,
              clients: [gateway],
              scrapeFrom: { namespace: observability },
            }

        task-db:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: task-db-tls
            clientCaSecretKey: ca.crt
          networkPolicy:
            {
              enabled: true,
              clients: [task],
              scrapeFrom: { namespace: observability },
            }
          # See `iam-db.database` above for why both lines exist, what `create: true`
          # adopts, and what refuses the apply without the `className`.
          database:
            create: true
            instance:
              storage:
                className: standard

        project:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: project-tls
            clientCaSecretKey: ca.crt
          projectDb:
            { tls: { enabled: true, clientCertSecret: project-client-tls } }
          # `seeder` JOINS `gateway` (plans/the-d35-seeder.md stage 7): the seeder
          # Job's pods (`app: seeder`) dial `project` on 50052 once per sync.
          # `project-db.networkPolicy.clients` below stays `[project]`: no module
          # but its twin reaches a `-db` (ADR-0936, ADR-0938).
          networkPolicy:
            {
              enabled: true,
              clients: [gateway, seeder],
              scrapeFrom: { namespace: observability },
            }

        project-db:
          autoscaling: { enabled: true }
          tls:
            enabled: true
            clientAuth: "required"
            clientCaSecret: project-db-tls
            clientCaSecretKey: ca.crt
          networkPolicy:
            {
              enabled: true,
              clients: [project],
              scrapeFrom: { namespace: observability },
            }
          # See `iam-db.database` above for why both lines exist, what `create: true`
          # adopts, and what refuses the apply without the `className`.
          database:
            create: true
            instance:
              storage:
                className: standard

        # ── THE D35 SEEDER: THIS ORGANISATION'S PROJECT REGISTRY ─────────────────────
        # plans/the-d35-seeder.md stage 7. THIS BLOCK IS THE ONE SOURCE OF THE
        # REGISTRY (ADR-0705, ADR-0713): the seeder Job sends it whole to `project`'s
        # `SyncProjects` on every sync of this Application. A path removed here is
        # ARCHIVED on the next sync, never deleted (ADR-0934); restoring the line
        # reactivates it.
        #
        # REQUIRED FROM PARENT 0.34.0 (seeder 0.2.0, seeder#6, the ADR-0857 contract
        # step): a render without `seeder.registry` refuses with "registry is
        # required". Before that (seeder 0.1.x, the expand step) a missing block
        # rendered no seeder objects at all.
        #
        # WHAT IS DECLARED, by Max's ruling of 2026-10-18: "Declare every yadgarhq repo
        # that holds tasks, plus the estate roots." Every non-archived repository of the
        # yadgarhq organisation, read with `gh repo list yadgarhq` on 2026-10-18. The
        # one archived repository, `deploy` (retired, ADR-0828), is left out. A new
        # repository is a new line here. `scripts/gates/test_yadgar_application.py`
        # (`DECLARED_REPOSITORIES`) holds this list.
        #
        # THE TWO ROOTS are namespace anchors (ADR-0673): resolvable through, never a
        # landing site. `estate` and `estate/smoke` are ledger 1244 option B: estate's
        # smoke runs claim the fixed path `estate/smoke`, and a root may not contain
        # `/`, so the landing path is a project under the root `estate`.
        #
        # `allowMassArchive: false` keeps the store's guard on (ADR-0939): a sync that
        # would archive more than half of the active org rows is refused. It has no
        # default, so it is stated.
        #
        # The TLS Secrets (`project-tls`, `seeder-client-tls`) are the parent chart's
        # defaults under `seeder.project.tls`, minted by `platform`; not restated here.
        #
        # TEAMS AND GRANTS (team access, plans/team-access.md stage 9; ADR-0962,
        # ADR-0963, ADR-0966). Needs a pinned parent whose seeder chart is at or
        # above stage 6 (seeder 0.2.2): an older seeder chart closes every level of
        # the registry and refuses `teams` and `grants`.
        # `scripts/gates/test_yadgar_application.py` (`TEAM_*`) pins this block.
        #
        # EACH MEMBER IS AN `account_segment`: the uuid after `yadgar:user:`, the form
        # `GET /auth/whoami` answers (ADR-0959), a lowercase uuidv7. Read 2026-10-25:
        # Max's from his own whoami; `estate-probe`'s from its own whoami in
        # argocd-verify run 39428452262; `estate-suite`'s from one read-only SELECT
        # on kind's iam-db (Max's authority of 2026-10-25), all three `is_admin`
        # read there. `estate-probe` is the non-admin login of argocd-verify's
        # `project-probe.yaml`; `estate-suite` is the primary login of estate's
        # `smoke.yaml`. The probe user is in `estate-runners` and never in
        # `administrators` (ADR-0966 B): it has no `/admin` privilege and no grant
        # under `yadgarhq`.
        #
        # Max amended ADR-0966 B's "administrators is Max alone" on 2026-10-25:
        # `max-admin` and `claude-probe` join `administrators`, and
        # `estate-suite-2` (estate smoke's secondary login) joins `estate-runners`.
        # Their uuids are as Max gave them on 2026-10-25; the seeder's
        # `unknown_member_user_ids` (empty, or the Job fails) checks each one.
        #
        # `seeder.iam.tls.caSecret` is REQUIRED, WITH NO DEFAULT, once `teams` is
        # declared (seeder chart, stage 6; ADR-0854): the Secret holding the
        # authority that signed iam's serving certificate, which is `iam-tls`. The
        # rest of the `iam` block (host, port, requestTimeoutSeconds, caSecretKey)
        # keeps the chart's defaults. The Job's `activeDeadlineSeconds` default is
        # 1200 (two retry loops); argocd pins no lower value.
        seeder:
          iam: { tls: { caSecret: iam-tls } }
          registry:
            teams:
              - name: administrators
                members:
                  - 01a14b5f-09cc-778e-a7d2-d73135411799 # Max
                  - 01a09141-fcbc-70d1-b857-36a1e9234025 # max-admin
                  - 01a11f6a-65eb-7060-9157-4449c91f8324 # claude-probe
              - name: estate-runners
                members:
                  - 01a11f7a-2947-770c-9599-efea3427ca13 # estate-probe (argocd-verify project-probe)
                  - 01a072e5-e97d-70b1-a9c5-e99b1c01a8ca # estate-suite (estate smoke, primary)
                  - 01a072e7-2a3b-77f1-b9ff-9790a1a72830 # estate-suite-2 (estate smoke, secondary)
            roots:
              - path: yadgarhq
                sourceRepo: yadgarhq/argocd
                grants:
                  - team: administrators
                    level: readWrite
              - path: estate
                sourceRepo: yadgarhq/estate
                grants:
                  - team: administrators
                    level: readWrite
                  - team: estate-runners
                    level: readWrite
            projects:
              - path: yadgarhq/actions
                displayName: actions
                sourceRepo: yadgarhq/actions
              - path: yadgarhq/argocd
                displayName: argocd
                sourceRepo: yadgarhq/argocd
              - path: yadgarhq/argocd-verify
                displayName: argocd-verify
                sourceRepo: yadgarhq/argocd-verify
              - path: yadgarhq/chart
                displayName: chart
                sourceRepo: yadgarhq/chart
              - path: yadgarhq/config
                displayName: config
                sourceRepo: yadgarhq/config
              - path: yadgarhq/dial
                displayName: dial
                sourceRepo: yadgarhq/dial
              - path: yadgarhq/docs
                displayName: docs
                sourceRepo: yadgarhq/docs
              - path: yadgarhq/estate
                displayName: estate
                sourceRepo: yadgarhq/estate
              - path: yadgarhq/gateway
                displayName: gateway
                sourceRepo: yadgarhq/gateway
              - path: yadgarhq/iam
                displayName: iam
                sourceRepo: yadgarhq/iam
              - path: yadgarhq/iam-db
                displayName: iam-db
                sourceRepo: yadgarhq/iam-db
              - path: yadgarhq/lifecycle
                displayName: lifecycle
                sourceRepo: yadgarhq/lifecycle
              - path: yadgarhq/platform
                displayName: platform
                sourceRepo: yadgarhq/platform
              - path: yadgarhq/project
                displayName: project
                sourceRepo: yadgarhq/project
              - path: yadgarhq/project-db
                displayName: project-db
                sourceRepo: yadgarhq/project-db
              - path: yadgarhq/proto
                displayName: proto
                sourceRepo: yadgarhq/proto
              - path: yadgarhq/seeder
                displayName: seeder
                sourceRepo: yadgarhq/seeder
              - path: yadgarhq/store
                displayName: store
                sourceRepo: yadgarhq/store
              - path: yadgarhq/task
                displayName: task
                sourceRepo: yadgarhq/task
              - path: yadgarhq/task-db
                displayName: task-db
                sourceRepo: yadgarhq/task-db
              - path: yadgarhq/telemetry
                displayName: telemetry
                sourceRepo: yadgarhq/telemetry
              - path: yadgarhq/yadgar
                displayName: yadgar
                sourceRepo: yadgarhq/yadgar
              - path: estate/smoke
                displayName: estate smoke
                sourceRepo: yadgarhq/estate
              # ABSENT ON PURPOSE: `estate/probe-archived` (team access stage 9 step 3;
              # ADR-0966). No repository: the pre-flip gate's leg (c) probe row, under
              # `estate/`, where `estate-runners` holds the probe user's grant.
              # argocd#155 declared it once so the seeder inserted it; leaving it out
              # here makes the seeder ARCHIVE it (ADR-0934; 1 of 26 active org rows,
              # under ADR-0939's guard). argocd's `project_probe.py --leg-c` writes to it
              # to count `PROJECT_ARCHIVED`. DO NOT DECLARE IT AGAIN: that reactivates
              # the row. `ARCHIVED_ON_PURPOSE` in the gate holds this.
              # ABSENT ON PURPOSE, RETIRED: `yadgarhq/probe-archived` (ledger 1624).
              # The archived arm's earlier row (argocd#112, argocd#114). The probe no
              # longer writes to it; it stays archived. DO NOT DECLARE IT AGAIN.
              # `ARCHIVED_ON_PURPOSE` holds it too.
            allowMassArchive: false
            allowMassRevoke: false

        # ── THE PLATFORM LAYER, COMING ON ONE OBJECT AT A TIME ───────────────────────
        # EVERY `false` BELOW MARKS SOMETHING `deploy` STILL OWNS, and each one is moved
        # by the step of `plans/retiring-the-deploy-copies.md` that deletes the copy.
        # The plan's ordering is not a preference: every Application in `infra/` carries
        # `prune: true` and `selfHeal: true`, so a toggle flipped while its copy still
        # exists is two automated Applications pruning each other's objects. The deletion
        # and the flip are ONE merge, which makes that interval empty rather than short.
        # `scripts/tests/test_no_two_owners.py` is the gate that refuses the other order.
        #
        # THE CONVERSE DOES NOT HOLD, and reading it that way is a trap. A toggle that is
        # `true` does not mean `deploy` owns nothing — after the last step `deploy` still
        # owns five objects no parent toggle can render. `preflight.enabled`, at the end
        # of this block, was never about ownership either.
        #
        # THE FALSES ARE STATED RATHER THAN INHERITED. They are also the chart's own
        # defaults; writing them here means a render this organisation measures is
        # reproducible from this file alone, and a later parent changing a default cannot
        # change this estate. `platform.enabled` true is what makes every one of them
        # load-bearing — until this step they were unreachable behind the dependency
        # `condition`, which is why they are written now rather than earlier.
        #
        # `platform.enabled: true` ADDS NO OBJECT BY ITSELF. Measured 2026-09-26 against
        # the pinned `yadgar:0.2.36`: this file renders 45 tuples, and this file with
        # `--set platform.enabled=true` renders the same 45. The two `valkey` keys below
        # take it to 48, and the three added are exactly `Deployment/valkey`,
        # `Service/valkey` and `NetworkPolicy/valkey-ingress`. That render carries ZERO
        # hook-annotated objects, which is what keeps `preflight` off the live estate's
        # sync at this step.
        platform:
          enabled: true

          # ── VALKEY: THE PARENT'S, AS OF STEP 3 ─────────────────────────────────────
          # `infra/valkey-app.yaml`, `infra/valkey/` and the `valkey-ingress` half of
          # `infra/network-policies/shared-infrastructure.yaml` were deleted in the merge
          # that set this true.
          valkey:
            create: true
            # THE SERVER'S TLS POSTURE IS STATED, NEVER DEFAULTED (B-L1, B-V2, PB-3).
            # Platform 0.2.1 refuses `valkey.create` without these. `"off"` is quoted:
            # a bare `off` is YAML 1.1's false, which the chart refuses by name.
            # `plaintext: false` closes the cleartext port 6379 (B-V4.3): `--port 0`, and
            # 6379 leaves the Deployment, the Service and `valkey-ingress`.
            # The valkey Deployment is `Recreate`, so any change here empties the cache.
            #
            # B-V4.1 (ledger 925): THE CACHE LISTENS WITH TLS ON 6380 BESIDE PLAINTEXT
            # 6379. The serving leaf is `valkey-tls` (SANs `valkey`, `valkey.yadgar`,
            # ...). The gateway dialled 6379 in cleartext until B-V4.2 turned its
            # `valkey.tls.enabled` on (above); B-V4.3 set `plaintext: false`. B-V5 set
            # `clientAuth: "optional"`: valkey asked for a client leaf and verified one
            # that was presented. B-V6 sets `clientAuth: "required"`
            # (`VALKEY_TLS_AUTH_CLIENTS` "yes"): valkey refuses a client with no leaf and
            # verifies the leaf against `ca.crt` in `valkey-tls`; the gateway presents
            # `gateway-client-tls`. valkey loads its
            # leaf only at boot: the boot script hashes it and liveness re-checks the
            # hash, so a renewal restarts the container (a cache gap, as here).
            tls: { enabled: true, clientAuth: "required", plaintext: false }

          # ── THE INTERNAL CA AND ITS TEN LEAVES: THE PARENT'S, AS OF STEP 5 ─────────
          # `infra/internal-tls-app.yaml` and `infra/internal-tls/` were deleted in the
          # merge that set these two true. The 13 rendered specs equal the 13 live
          # specs field for field, measured 2026-09-27 against `kind-yadgar`, so the
          # handover rewrites the tracking-id and reissues nothing: the CA Secret and
          # the ten leaf Secrets keep their names, and cert-manager here runs without
          # `--enable-certificate-owner-ref`, so no Secret is owned by a Certificate.
          internalCA:
            create: true
          certificates:
            create: true

          # ── A SECOND BROKER, BESIDE `deploy`'S, AS OF STEP 6's FIRST MERGE ─────────
          # Step 6 runs as THREE merges: stand this broker up, move the clients to it,
          # then delete `infra/nats.yaml`. This is the first. The copy deleted in the
          # same merge is `infra/network-policies/nats-ingress.yaml`, because
          # `nats-ingress` is the one object this toggle renders that `deploy` also
          # held; the rendered spec equals that file's spec field for field. The other
          # five objects are named `yadgar-nats*` after this release and collide with
          # nothing, so `infra/nats.yaml`'s broker keeps running. Both brokers read
          # `nats-auth` and `nats-auth-gateway`, which the chart's `bootstrap` hooks
          # mint (step 9, ADR-0810), so this one starts with working accounts.
          #
          # THE SECOND MERGE MOVED BOTH CLIENTS HERE: `gateway.nats.url` and
          # `iam.nats.url` above read `nats://yadgar-nats:4222`, where the module
          # default `nats://nats:4222` dials `deploy`'s broker. The two brokers are not
          # clustered, so during that merge's roll an `iam` pod and a `gateway` pod can
          # sit on different brokers and an invalidation crosses nothing; gateway's
          # credential cache TTL (`YADGAR_CREDENTIAL_TTL_SECONDS`, 30 here) bounds the
          # stale answer. `infra/nats.yaml` stayed until the third merge, so a revert of
          # the second found the old broker still serving.
          #
          # THE THIRD MERGE DELETED `infra/nats.yaml`, SO THIS IS NOW THE ONLY BROKER
          # ANY APPLICATION RENDERS. No Application carries a finalizer, so the delete
          # ORPHANED `deploy`'s five objects (`StatefulSet`, `Service`,
          # `PodDisruptionBudget` `nats`, `Service/nats-headless`,
          # `ConfigMap/nats-config`) rather than deleting them; nothing dials them.
          # B4b in MIGRATION_NOTES.md deletes them by hand before B5.
          #
          # B5 RENAMES THIS BROKER TO `nats` BY DELETE-THEN-ADOPT. Parent 0.2.42's
          # `platform` carries `fullnameOverride: nats`, so the sync prunes the five
          # `yadgar-nats*` objects and creates the same five as `nats*`, the names
          # both clients' module default dials.
          nats:
            create: true
            # THE BROKER'S TLS POSTURE IS STATED, NEVER DEFAULTED (B-L1, B-N2, PB-3).
            # Platform 0.2.1 refuses `nats.create` without both keys. NATS has no
            # `optional` mode, so the next value after `"off"` is `"required"`
            # (ADR-0854).
            #
            # B-N4.1 (ledger 925): THE LISTENER SPEAKS TLS. The platform switch and the
            # upstream keys that do the work are written side by side; platform 0.2.1
            # refuses them if they disagree. The serving leaf is `nats-tls` (issued
            # since 0.13.13). B-N4.1's `allow_non_tls: true` kept both clients, then
            # cleartext, connected until B-N4.2 turned them on (`nats.tls.enabled:
            # true` above).
            #
            # B-N4.3 (ledger 925): THE LISTENER REFUSES PLAINTEXT. `allow_non_tls` is
            # gone, so nats-server sends `TLSRequired` and drops a client that does
            # not upgrade. Re-adding it while no NATS hop is cleartext reddens
            # `broker_failures`.
            #
            # B-N5 (ledger 925): THE LISTENER VERIFIES EVERY CLIENT'S LEAF.
            # `clientAuth: "required"` and the upstream `verify: true` (nats-server's
            # RequireAndVerifyClientCert) with `ca_file` at the `ca.crt` cert-manager
            # writes beside the `nats-tls` leaf (`yadgar-internal-ca`, the issuer of
            # `gateway-client-tls` and `iam-client-tls`). `verify`, not
            # `verify_and_map`: the password `authorization` users stay the identity;
            # the leaf is a second control. Platform 0.2.1 refuses `required` without
            # both upstream keys, and the parent refuses it unless both clients
            # present a leaf. Each change here rolls `nats-0`
            # (`configChecksumAnnotation`).
            tls: { enabled: true, clientAuth: "required" }
            config:
              nats:
                tls:
                  enabled: true
                  secretName: nats-tls
                  merge: { verify: true, ca_file: /etc/nats-certs/nats/ca.crt }

          # ── THE EDGE: THE PARENT'S, AS OF STEP 7 ───────────────────────────────────
          # `infra/tls/{certificate,envoyproxy,gatewayclass,gateway}.yaml` were deleted
          # in the merge that set these two true. `infra/tls-app.yaml` SURVIVES with
          # `ca-preflight.yaml` and `clusterissuer.yaml`: the parent renders neither
          # the preflight nor `ClusterIssuer/yadgar-dev-ca`. `deploy#68` put
          # `Prune=false` on the four copies one merge ahead, so the handover rewrites
          # the tracking-id on the same four objects. The four rendered objects equal
          # the deleted copies field for field (ignoring namespace and that
          # annotation), measured 2026-09-27 at the pinned 0.3.7 and asserted by
          # `scripts/tests/test_no_two_owners.py`.
          edgeTLS:
            create: true
            # EXPLICIT, AND LOAD-BEARING. Left empty with `internalCA.create` true,
            # the chart signs the edge leaf with its internal CA — a root no client
            # trusts — and cert-manager reissues `gateway-tls` on the handover. The
            # ClusterIssuer is `deploy`'s own (`infra/tls/clusterissuer.yaml`).
            issuerRef:
              name: yadgar-dev-ca
              kind: ClusterIssuer
          gatewayListener:
            create: true
            envoyProxy:
              # THIS CLUSTER'S EDGE, NOT THE ADOPTER'S (ADR-0809). Under rootless
              # podman the host cannot route to container IPs, so there is no
              # LoadBalancer here: kind maps host 18443 to node port 30443 on the
              # control-plane node only (`modules/nixos/kind.nix` in the nix repo is
              # the other half), and the Envoy Service's `externalTrafficPolicy` is
              # `Local`. So the data plane must run on that node, and the nodePort is
              # pinned. An unpinned nodePort is allocated at random, and a proxy on a
              # worker leaves the mapped port with no local endpoint.
              serviceType: NodePort
              httpsNodePort: 30443
              pod:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule

          # ── STILL `deploy`'S ───────────────────────────────────────────────────────
          # Each line names the step that moves it and the copy that has to go first.
          # ── THE BOOTSTRAP SECRETS, THE PARENT'S SINCE STEP 9 (ADR-0810) ────────────
          # Step 9 ran as TWO merges with hand step A5b between. The first deleted
          # `infra/bootstrap/`; A5b deleted its five orphaned Job/RBAC objects; this
          # second merge turns `create` on. The parent's two hook Jobs
          # (`pre-install,pre-upgrade`, which Argo runs as `PreSync`) mint
          # `valkey-password`, `nats-auth`, `nats-auth-gateway` and
          # `admin-bootstrap-token`. They are create-only: an existing Secret answers
          # 409 and is left untouched, so they re-run on every sync and change nothing.
          #
          # `iamKeys.create` IS TRUE, AND IT IS STATED, NOT LEFT TO THE DEFAULT
          # (ADR-1086, which lifts ADR-0810's `false`). The parent's mint is safe only
          # where iam refuses a wrong key (ADR-0753). Since 2026-10-31 both iam pods
          # log that the key set they hold is the one iam-db's rows were encrypted
          # under (ADR-0764), so the refusal is armed here. The mint is create-only:
          # where `iam-keys` exists the POST answers 409 and the Secret is left
          # untouched, so `make secrets` keeps owning the live Secret. Only a rebuild
          # that skips `make secrets` mints a NEW key, and iam then refuses it
          # (MISMATCH) by design. Delete this line and the parent default still mints
          # it; `scripts/gates/test_no_two_owners.py` refuses that by name.
          bootstrap:
            create: true
            adminToken:
              secretName: admin-bootstrap-token # = gateway.adminBootstrap.tokenSecret
            iamKeys:
              create: true # ADR-1086, yaadgaar 354

          # THE OPERATORS RELEASE IS NOT THIS ORGANISATION'S PATH (ADR-0787). `infra/`
          # installs cert-manager, KEDA, mariadb-operator, Envoy Gateway and Argo CD as
          # Applications of their own, and no step of the retirement plan moves them.
          operators:
            create: false

          # ON AS OF B9 of `plans/the-one-application-install.md`, with the parent pin
          # moved to 0.3.13 in the same merge. This removes the one values diff from an
          # adopter's install that ADR-0803's decision 2 names.
          #
          # STATED `true` RATHER THAN DELETED, for the rule this block opens with: the
          # chart defaults it true today, and writing it here means a later parent that
          # flips the default cannot switch this estate's probes off unseen.
          #
          # WHY IT WAS OFF UNTIL NOW. Measured 2026-09-26 on `platform` 0.1.12: the
          # cert-manager and KEDA arms of `preflight`, and the post-install
          # `envoy-gateway-probe`, FAILED on a healthy cluster. The API server
          # pretty-prints for a `User-Agent` beginning with `curl`, which defeated the
          # Jobs' line matcher. 0.1.13 sends `?pretty=false` and a non-curl agent.
          # `platform` 0.1.20 then gave the Envoy Gateway probe its own EnvoyProxy, so
          # it no longer asks for the edge's pinned nodePort 30443, and 0.1.21 added the
          # Prometheus arm. Parent 0.3.13 carried 0.1.21 then.
          #
          # WHAT IT RUNS ON EVERY SYNC, because Argo runs hooks on every sync,
          # `selfHeal` ones included. PreSync: `Job/preflight` probes cert-manager,
          # KEDA, mariadb-operator (a server-side dry run) and Prometheus at
          # `prometheus-server.observability`, each bounded at 120s. PostSync:
          # `Job/envoy-gateway-probe` creates its own EnvoyProxy and Gateway in this
          # namespace (two Envoy pods on the control-plane node, as `edge` has),
          # waits up to 300s for `Programmed`, then deletes both. Every probe's RBAC is
          # a namespaced `Role`. A failed PreSync Job fails the sync. With no
          # `syncPolicy.retry` on this Application, Argo's automated sync retries it up
          # to 5 times with Argo's default backoff; a persistent failure then holds at
          # that commit until a manual sync, a new commit, or a revert.
          preflight:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    # WHERE EVERY OBJECT LANDS, and it has to be one namespace: a pod can only
    # mount a ConfigMap from the namespace it runs in, and the modules' ConfigMaps
    # come from the same chart. EDIT THIS if you want the estate somewhere other
    # than a namespace called `yadgar`.
    namespace: yadgar
  syncPolicy:
    # S0 OF THE HANDOVER (ADR-0828), AND THE ONE PLACE THIS FILE DIFFERS FROM
    # THE EXAMPLE OUTSIDE `valuesObject`: no `automated.prune`. The example
    # carries `prune: true`. Without it, an object a later pin or values change
    # stops rendering stays live and reads OutOfSync with `requiresPruning`
    # until somebody syncs with prune by hand.
    automated:
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    # A RETRY WINDOW THAT OUTLASTS OPERATOR AND DATABASE START-UP. Measured
    # 2026-09-30 on kind: Argo's default window (5 retries, about 5 minutes) ran
    # out while the Application was still `Degraded`, and a hand-started sync was
    # the only way on. The waits are
    # 30, 60, 120, 240, 300 and 300 s: 17.5 minutes in all (Argo waits `duration *
    # factor^n` before retry n, capped at `maxDuration`). Longer is worse, not
    # safer: while an operation is retrying, Argo syncs no new revision, so a fix
    # pushed during the window waits for it to end. Never `-1`.
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
